version: '3.8'

services:
  baileys:
    build: .
    container_name: lidzy-baileys
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=info
    volumes:
      # Volume persistente para sessões (IMPORTANTE!)
      - baileys_auth:/app/auth
      - baileys_logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - baileys_network

volumes:
  baileys_auth:
    driver: local
  baileys_logs:
    driver: local

networks:
  baileys_network:
    driver: bridge
